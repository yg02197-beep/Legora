name: Tripod Baseline Extended

on:
  push:
    branches:
      - spike/tripod-validation
    paths:
      - 'tools/tripod_remote_validation.py'
      - 'tools/run_tripod_validation.py'
      - 'tools/tripod_baseline_extended.py'
      - '.github/workflows/tripod-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile
        run: python -m py_compile tools/tripod_remote_validation.py tools/run_tripod_validation.py tools/tripod_baseline_extended.py
      - name: Run extended baseline
        run: |
          mkdir -p tripod_baseline_results
          set -o pipefail
          python tools/tripod_baseline_extended.py | tee tripod_baseline_results/console.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripod-baseline-results
          path: tripod_baseline_results/
          if-no-files-found: warn
          retention-days: 7
