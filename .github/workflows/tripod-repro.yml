name: Tripod Claim Reproduction Finder
on:
  push:
    branches: [spike/tripod-validation]
    paths:
      - 'tools/tripod_repro_finder.py'
      - '.github/workflows/tripod-repro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -m py_compile tools/tripod_remote_validation.py tools/tripod_repro_finder.py
      - run: |
          mkdir -p tripod_repro_results
          set -o pipefail
          python tools/tripod_repro_finder.py | tee tripod_repro_results/console.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripod-repro-results
          path: tripod_repro_results/
          retention-days: 7
